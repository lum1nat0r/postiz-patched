name: build-and-push
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      postiz-tag:
        description: 'Postiz-Upstream-Tag (z.B. v2.23.0)'
        required: false
        default: v2.23.0
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          TAG="${{ inputs.postiz-tag || 'v2.23.0' }}"
          echo "tags=ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:postiz-${TAG}" >> "$GITHUB_OUTPUT"
          echo "postiz_tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            POSTIZ_TAG=${{ steps.tags.outputs.postiz_tag }}
